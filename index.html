<!DOCTYPE html>
<html>
  <head>
    <title>Flexbox Pricing Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Sono", sans-serif;
        display:flex;
        border-radius: 5px;
      }
      .pricing-container{
        display:flex;
        flex:100vh;
        align-items: center;
        justify-content: center;

      }
      .pricing-plan{
        background-color: #f2f2f2;
        width:100%;
        max-width: 400px;
        margin:2rem;
        flex-direction: column;
        align-items: stretch;
        align-items: center;
        justify-content: center;
        display: flex;
        padding: 20px;


      }

      .plan-title{
        font-weight: 700;
        font-size:24px;
        padding-bottom:10px;
        
      }
      .plan-price{
        height:58px;
        font-weight: 700;
        font-size:48px;
      }
      .plan-button{
        background-color: #ff6600;
        color:#ffffff;
        border:none;
        border-radius:5px;
        padding: 10px 20px;
        font-family: "Sono", sans-serif;
        font-size: 14px;
        
      }
      .ul{
  list-style: none;
  padding:0;
  margin: 0;
}


      /* Hint:  Wat kun je doen met een media query en flexbox?  */
      @media (max-width: 1274px) {
        .pricing-container{
        display:flex;
        flex:100vh;
        align-items: center;
        justify-content: center;
        flex-direction: column;

      }
    }
    </style>
  </head>

  <body>
    <div class="pricing-container">
      <div class="pricing-plan">
        <div class="plan-title">Basis</div>
        <div class="plan-price">€11,99/maand</div>
        <ul class="plan-features">
          <li>✅ 10GB Opslag</li>
          <li>✅ 1 Gebruiker</li>
          <li>🚫 Ondersteuning</li>
        </ul>
        <button class="plan-button">Aanmelden</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Standaard</div>
        <div class="plan-price">€19,99/maand</div>
        <ul class="plan-features">
          <li>✅ 50GB Opslag</li>
          <li>✅ 5 Gebruikers</li>
          <li>✅ Telefonische &amp; E-mailondersteuning</li>
        </ul>
        <button class="plan-button">Aanmelden</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Premium</div>
        <div class="plan-price">€49,99/maand</div>
        <ul class="plan-features">
          <li>✅ 100GB Opslag</li>
          <li>✅ 10 Gebruikers</li>
          <li>✅ 24/7 Ondersteuning</li>
        </ul>
        <button class="plan-button">Aanmelden</button>
      </div>
    </div>
  </body>
